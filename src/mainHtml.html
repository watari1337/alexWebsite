<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя визитка</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #111;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }
        .links a {
            display: inline-block;
            margin: 5px 10px;
            color: #0076ff;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Замените на свое имя -->
        <h1>Алексей Клевко</h1> 
        
        <!-- Небольшое описание -->
        <p>Привет! Я создаю веб-сайты и это моя личная страница-визитка.</p>
        
        <!-- Ваши ссылки -->
        <div class="links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://t.me" target="_blank">Telegram</a>
            <a href="mailto:your-email@example.com">Email</a>
        </div>
    </div>

</body>
</html>
